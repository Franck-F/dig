name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch — saves CI minutes when a
# contributor pushes several commits in quick succession.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Each job opts in to anything broader.
permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `prisma generate` populates `node_modules/.prisma/client` which the
      # TS compiler needs to resolve `@prisma/client` types. Skip download
      # of the query engine binary because we won't run queries here.
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: '1'

      - name: Lint
        run: npm run lint

      # Mentora debt counters (inline styles, hard-coded text, name helpers,
      # guard warnings) against scripts/mentora-metrics.baseline.json:
      # fails only when one grows.
      - name: Mentora debt baseline
        run: npm run metrics:mentora

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          # Prisma 6.19+ reads env() values during validate.
          # CI never connects, so any well-formed URL satisfies it.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
          DIRECT_URL: postgresql://user:pass@localhost:5432/db?schema=public

      - name: Run unit tests
        run: npm test

      - name: Compute coverage
        # Node's `--experimental-test-coverage` writes coverage to stdout
        # in the same run, so we re-execute the suite once with coverage.
        # Cheap because the test surface is small. Output goes to the
        # workflow log so reviewers can see line/branch percentages
        # without leaving GitHub.
        run: npm run test:coverage

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: lint-typecheck-test

    # Throwaway database for this run only. The test setup refuses any URL
    # whose database name does not end in _test (src/test-setup/test-db-url.mjs).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: digizelle_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U test -d digizelle_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL_TEST: postgresql://test:test@localhost:54329/digizelle_test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Applies every migration to the empty service DB, then runs the
      # server actions against it (todo cases = known bugs left for phase 2).
      - name: Run integration tests
        run: npm run test:integration

  build:
    name: Build (Next.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    needs: lint-typecheck-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Build with placeholder secrets. Real production env vars live on
      # Vercel and are injected by their build pipeline; this CI build is
      # only checking that the bundle compiles cleanly. We disable Sentry
      # source map upload here (no auth token) so the step doesn't fail
      # on missing credentials.
      - name: Build
        # `build:ci` skips `prisma migrate deploy` — the placeholder
        # DATABASE_URL points nowhere, and we only need next build to
        # type-compile against the generated client.
        run: npm run build:ci
        env:
          AUTH_SECRET: ci-placeholder-do-not-use-in-prod
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
          DIRECT_URL: postgresql://user:pass@localhost:5432/db?schema=public
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          # Skip Sentry plugin entirely — it tries to upload sourcemaps on
          # `next build` when an auth token is set.
          SENTRY_DSN: ''
          NEXT_PUBLIC_SENTRY_DSN: ''
          SENTRY_AUTH_TOKEN: ''

      # Per-route JS weight of the Mentora pages from the build output;
      # fails on a regression over 5 % against scripts/mentora-bundle.baseline.json.
      - name: Mentora bundle report
        run: npm run bundle:mentora
